# Eclipse BaSyx AAS Environment configuration
# Source: https://github.com/eclipse-basyx/basyx-java-server-sdk
# License: MIT License — Eclipse BaSyx project
server.port=8081
basyx.backend=MongoDB
basyx.environment=file:aas
basyx.cors.allowed-origins=*
basyx.cors.allowed-methods=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
basyx.aasrepository.feature.registryintegration=http://aas-registry:8081
basyx.submodelrepository.feature.registryintegration=http://sm-registry:8081
basyx.externalurl=http://${HOST_IP}:8081
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.data.mongodb.uri=mongodb://mongoAdmin:mongoPassword@mongo:27017/aas-env?authSource=admin
mqtt.clientId=AAS-Env-8081
mqtt.hostname=mosquitto
mqtt.port=1883
basyx.aasrepository.feature.mqtt.enabled=true
basyx.submodelrepository.feature.mqtt.enabled=true
# Explicit repo name so MQTT topic = sm-repository/sm-repo/submodels/...
# matching the Test Orchestrator's hardcoded subscription topic
basyx.smrepo.name=sm-repo
spring.web.resources.static-locations=classpath:/static/,file:/application/static/
