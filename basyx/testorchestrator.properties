server.port=8082

spring.application.name=TestOrchestrator
basyx.smrepo.name=sm-repo
basyx.backend=InMemory

# Register validation-result submodels in our SM registry
basyx.submodelrepository.feature.registryintegration=http://sm-registry:8081
basyx.externalurl=http://localhost:8085

basyx.cors.allowed-origins=*
basyx.cors.allowed-methods=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD

# AAS Environment where validated submodels live
submodel.api.base-url=http://aas-env:8081
